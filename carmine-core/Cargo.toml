[package]
name = "carmine-core"
version = "0.1.0"
edition = "2024"
description = "Pure-Rust HTML/CSS rendering engine"

[dependencies]
scraper = "0.22"
ego-tree = "0.10"
cssparser = "0.34"
csscolorparser = "0.8"
taffy = "0.7"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
