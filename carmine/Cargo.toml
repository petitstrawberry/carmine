[package]
name = "carmine"
version = "0.1.0"
edition = "2024"
description = "A small pure-Rust HTML/CSS browser"

[features]
default = ["scarlet"]
scarlet = [
    "dep:scarlet-sys",
    "dep:scarlet-ui",
    "dep:scarlet-ui-macros",
]

[dependencies]
carmine-core = { path = "../carmine-core" }
clap = { version = "4", features = ["derive"] }
url = "2"

scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", package = "scarlet-sys", optional = true }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "775e42f502f4e150bb614bbe2c1ed76d46530484", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"], optional = true }
scarlet-ui-macros = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "775e42f502f4e150bb614bbe2c1ed76d46530484", package = "scarlet-ui-macros", optional = true }
scraper = "0.27.0"
ego-tree = "0.11.0"
encoding_rs = "0.8"
boa_engine = "0.20"
ureq = { version = "2", features = ["tls"] }
getrandom = { version = "0.2", features = ["custom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-os = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", package = "scarlet-os" }
